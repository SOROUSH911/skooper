<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skooper Recorder</title>
  <link rel="stylesheet" href="../css/popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="header">
      <div class="title">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" fill="#667eea"/>
          <circle cx="12" cy="12" r="6" fill="white"/>
          <circle cx="12" cy="12" r="3" fill="#667eea"/>
        </svg>
        <span>Skooper</span>
      </div>
      <div class="close-btn" id="close-btn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 4L4 12M4 4L12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- Recording Options -->
    <div class="recording-options">
      <div class="option-group">
        <div class="option-header">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="3" width="16" height="11" rx="1" stroke="currentColor" stroke-width="2"/>
            <path d="M8 21V17M12 21V17M8 17H12" stroke="currentColor" stroke-width="2"/>
          </svg>
          <span>Screen</span>
        </div>
        <div class="option-buttons">
          <button class="option-btn active" id="full-screen-btn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="2" y="3" width="12" height="8" rx="1" stroke="currentColor" stroke-width="1.5"/>
              <path d="M6 13V12H10V13" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            Full Screen
          </button>
          <button class="option-btn" id="current-tab-btn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="2" y="4" width="12" height="8" rx="1" stroke="currentColor" stroke-width="1.5"/>
              <path d="M4 4V3C4 2.44772 4.44772 2 5 2H11C11.5523 2 12 2.44772 12 3V4" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            Current Tab
          </button>
        </div>
      </div>

      <div class="option-group">
        <div class="option-header">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 4.5A.5.5 0 012.5 4H9.5A.5.5 0 0110 4.5V11.5A.5.5 0 019.5 12H2.5A.5.5 0 012 11.5V4.5Z" stroke="currentColor" stroke-width="2"/>
            <path d="M10 5.5L16 2V14L10 10.5" stroke="currentColor" stroke-width="2"/>
          </svg>
          <span>Camera</span>
        </div>
        <div class="toggle-switch">
          <input type="checkbox" id="camera-toggle" class="toggle-input">
          <label for="camera-toggle" class="toggle-label">
            <span class="toggle-slider"></span>
          </label>
          <span class="toggle-text">On</span>
        </div>
      </div>

      <div class="option-group">
        <div class="option-header">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 2A2 2 0 016 4V8A2 2 0 006 12A6 6 0 0018 12H16A4 4 0 01-8 12A2 2 0 0110 4V8A2 2 0 008 2Z" stroke="currentColor" stroke-width="2"/>
            <path d="M10 18V14" stroke="currentColor" stroke-width="2"/>
          </svg>
          <span>Microphone</span>
        </div>
        <div class="toggle-switch">
          <input type="checkbox" id="mic-toggle" class="toggle-input" checked>
          <label for="mic-toggle" class="toggle-label">
            <span class="toggle-slider"></span>
          </label>
          <span class="toggle-text">On</span>
        </div>
      </div>
    </div>

    <!-- Record Button -->
    <div class="record-section">
      <button class="record-btn" id="start-record-btn">
        <div class="record-btn-content">
          <div class="record-dot"></div>
          <span>Start Recording</span>
        </div>
      </button>
    </div>

    <!-- Status Messages -->
    <div class="status-message" id="status-message" style="display: none;"></div>

    <!-- Upload Progress -->
    <div class="upload-progress" id="upload-progress" style="display: none;">
      <div class="progress-info">
        <span class="progress-text">Uploading...</span>
        <span class="progress-percent">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
  </div>

  <script src="../js/popup.js"></script>
</body>
</html>
