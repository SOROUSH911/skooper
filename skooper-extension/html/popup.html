<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skooper Recorder</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Close Button -->
    <button class="close-btn" id="close-btn">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 4L4 12M4 4L12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- Header -->
    <div class="header">
      <div class="title">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" fill="#667eea"/>
          <circle cx="12" cy="12" r="6" fill="white"/>
          <circle cx="12" cy="12" r="3" fill="#667eea"/>
        </svg>
        <span>Skooper</span>
      </div>
    </div>

    <!-- Screen Recording Title -->
    <div class="screen-recording-title">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="3" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <path d="M7 17H13M10 14V17" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <span>Screen Recording</span>
    </div>

    <!-- Recording Options -->
    <div class="recording-options">
      <!-- Camera Button -->
      <div class="option-button" id="camera-btn">
        <div class="option-main" id="camera-main">
          <div class="option-icon">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="2" y="5" width="11" height="8" rx="1" fill="currentColor"/>
              <path d="M13 7L17 4V12L13 9" fill="currentColor"/>
            </svg>
          </div>
          <span class="option-label">Camera</span>
          <div class="toggle-oval" id="camera-toggle">
            <span class="toggle-text">On</span>
          </div>
        </div>
      </div>

      <!-- Microphone Button -->
      <div class="option-button" id="microphone-btn">
        <div class="option-main" id="microphone-main">
          <div class="option-icon">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M10 2C8.34315 2 7 3.34315 7 5V9C7 10.6569 8.34315 12 10 12C11.6569 12 13 10.6569 13 9V5C13 3.34315 11.6569 2 10 2Z" fill="currentColor"/>
              <path d="M6 9C6 12.3137 8.68629 15 12 15H8C11.3137 15 14 12.3137 14 9" stroke="currentColor" stroke-width="1.5"/>
              <path d="M10 15V18" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </div>
          <span class="option-label">Microphone</span>
          <div class="toggle-oval" id="microphone-toggle">
            <span class="toggle-text">On</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Record Button -->
    <div class="record-section">
      <button class="record-btn" id="start-record-btn">
        <div class="record-btn-content">
          <div class="record-dot"></div>
          <span>Start Recording</span>
        </div>
      </button>
    </div>

    <!-- Status Messages -->
    <div class="status-message" id="status-message" style="display: none;"></div>

    <!-- Upload Progress -->
    <div class="upload-progress" id="upload-progress" style="display: none;">
      <div class="progress-info">
        <span class="progress-text">Uploading...</span>
        <span class="progress-percent">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- Device Selection Modal -->
    <div class="device-modal" id="device-modal" style="display: none;">
      <div class="device-modal-content">
        <div class="device-modal-header">
          <h3 id="device-modal-title">Select Camera</h3>
          <button class="device-modal-close" id="device-modal-close">×</button>
        </div>
        <div class="device-list" id="device-list">
          <!-- Devices will be populated here -->
        </div>
      </div>
    </div>
  </div>

  <script src="../js/popup.js"></script>
</body>
</html>
