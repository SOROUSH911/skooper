<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skooper Recording</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/recorder.css">
  <link rel="stylesheet" href="../css/camera-bubble.css">
</head>
<body>
  <div class="recorder-container">
    <h1>🎬 Skooper Recording in Progress</h1>
    <div class="status">
      <span class="recording-indicator"></span>
      <span id="status-text">Initializing...</span>
    </div>

    <div class="timer" id="timer">00:00</div>

    <video id="preview" autoplay muted></video>

    <div class="controls">
      <button id="stop-btn">Stop Recording</button>
      <button id="cancel-btn">Cancel</button>
    </div>

    <div id="error" class="error"></div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/camera-bubble.js"></script>
  <script src="../js/recorder.js"></script>
</body>
</html>
