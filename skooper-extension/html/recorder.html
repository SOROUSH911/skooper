<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Skooper Recording</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    
    .recorder-container {
      text-align: center;
      max-width: 600px;
    }
    
    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }
    
    .status {
      font-size: 18px;
      margin-bottom: 20px;
      color: #667eea;
    }
    
    .recording-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      background: #ef4444;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 1s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    video {
      width: 100%;
      max-width: 500px;
      height: auto;
      background: #000;
      border-radius: 8px;
      margin: 20px 0;
    }
    
    .controls {
      margin-top: 20px;
    }
    
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin: 0 10px;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .error {
      color: #ef4444;
      margin-top: 20px;
    }
    
    .timer {
      font-size: 24px;
      font-weight: bold;
      margin: 20px 0;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="recorder-container">
    <h1>🎬 Skooper Recording in Progress</h1>
    <div class="status">
      <span class="recording-indicator"></span>
      <span id="status-text">Initializing...</span>
    </div>
    
    <div class="timer" id="timer">00:00</div>
    
    <video id="preview" autoplay muted></video>
    
    <div class="controls">
      <button id="stop-btn">Stop Recording</button>
      <button id="cancel-btn">Cancel</button>
    </div>
    
    <div id="error" class="error"></div>
  </div>

  <script src="../js/recorder.js"></script>
</body>
</html>
